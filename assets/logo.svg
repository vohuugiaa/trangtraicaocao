<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 100" width="100%" height="100%">
  <defs>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#16a34a"/>
      <stop offset="100%" stop-color="#15803d"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- Logo Icon Container -->
  <g transform="translate(10, 10)">
    <!-- Shield / Hexagon Shape -->
    <rect x="0" y="0" width="80" height="80" rx="20" fill="url(#primaryGrad)" filter="url(#shadow)"/>
    
    <!-- Sun / Glow circle -->
    <circle cx="40" cy="40" r="28" fill="#ffffff" opacity="0.15"/>
    
    <!-- Stylized Grasshopper / Leaf Icon -->
    <path d="M 22 56 C 26 40, 42 26, 62 24 C 54 36, 46 48, 32 58 Z" fill="#ffffff"/>
    <path d="M 28 54 C 36 46, 50 38, 58 32 C 48 44, 40 52, 28 58 Z" fill="#fef08a"/>
    <!-- Grasshopper Antenna & Legs -->
    <path d="M 58 25 Q 66 18, 68 12" stroke="#fef08a" stroke-width="2.5" stroke-linecap="round" fill="none"/>
    <path d="M 54 26 Q 60 16, 62 10" stroke="#ffffff" stroke-width="2" stroke-linecap="round" fill="none"/>
    <!-- Leg Joint -->
    <path d="M 38 48 L 52 58 L 58 68" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <circle cx="52" cy="58" r="2.5" fill="#fef08a"/>
    <circle cx="56" cy="28" r="2" fill="#15803d"/>
    
    <!-- Sprout / Grass base -->
    <path d="M 20 66 Q 28 60, 38 64 Q 28 66, 20 66 Z" fill="#bbf7d0"/>
  </g>

  <!-- Text Branding -->
  <g transform="translate(104, 20)">
    <!-- Subtitle / Tagline -->
    <rect x="0" y="0" width="168" height="20" rx="10" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1"/>
    <text x="10" y="14" font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="700" fill="#15803d" letter-spacing="1">
      ★ TRẠI GIỐNG UY TÍN SỐ 1
    </text>

    <!-- Main Title -->
    <text x="0" y="44" font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="900" fill="#14532d" letter-spacing="-0.5">
      TRANG TRẠI CÀO CÀO
    </text>

    <!-- Tagline bottom -->
    <text x="0" y="62" font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#64748b" letter-spacing="0.2">
      Trứng Cào Cào Cốm Chuẩn Giống • Tỉ Lệ Nở Cao
    </text>
  </g>
</svg>
